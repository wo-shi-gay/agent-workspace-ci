name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SRC_DIR: src

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          set -euo pipefail
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          tar -xzf source.tar.gz -C "$SRC_DIR"
          ls -la "$SRC_DIR" | head -30
          test -f "$SRC_DIR/gradlew" || { echo "FATAL: gradlew missing"; exit 1; }
          test -f "$SRC_DIR/keystore/workspace.jks" || { echo "FATAL: keystore missing"; exit 1; }
          test -f "$SRC_DIR/gradle/wrapper/gradle-wrapper.jar" || { echo "FATAL: wrapper jar missing"; exit 1; }

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK found at $SDK"
          ls "$SDK" || true

      - name: Accept licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/lic.log 2>&1 || true
          tail -3 /tmp/lic.log || true

      - name: Install platform + build-tools
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /tmp/sdk.log 2>&1 || true
          tail -5 /tmp/sdk.log || true
          echo "--- platforms after ---"; ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Verify keystore
        run: |
          set -euo pipefail
          ls -lh src/keystore/workspace.jks

      - name: Tune gradle for CI
        working-directory: src
        run: |
          set -euo pipefail
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|^org.gradle.parallel=.*|org.gradle.parallel=true|' gradle.properties
          sed -i 's|^org.gradle.workers.max=.*|org.gradle.workers.max=4|' gradle.properties
          grep -q '^org.gradle.parallel='   gradle.properties || echo 'org.gradle.parallel=true'     >> gradle.properties
          grep -q '^org.gradle.workers.max=' gradle.properties || echo 'org.gradle.workers.max=4'    >> gradle.properties
          echo "--- gradle.properties ---"
          cat gradle.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          echo "--- compileSdk/targetSdk in build.gradle.kts ---"
          grep -n 'compileSdk = \|targetSdk = ' app/build.gradle.kts

      - name: Grant exec on gradlew
        working-directory: src
        run: chmod +x gradlew

      - name: Build release APK (R8 disabled)
        working-directory: src
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/src/keystore/workspace.jks
          SIGNING_STORE_PASSWORD: agentnb666
          SIGNING_KEY_ALIAS: workspacenb666
          SIGNING_KEY_PASSWORD: agentnb666
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Collect build log tail
        if: always()
        run: |
          echo "================ gradle tail ================"
          tail -120 /tmp/gradle.log 2>/dev/null || true

      - name: Show outputs
        if: always()
        run: |
          find src/app/build/outputs -type f -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workspace-apk
          path: |
            src/app/build/outputs/apk/release/*.apk
            src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Release (fast download via github.com)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find src/app/build/outputs/apk -type f -name "*.apk" | head -1)
          echo "APK=$APK"
          test -n "$APK"
          VER=$(grep -m1 'APP_VERSION_NAME' src/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VER=$VER"
          TAG="v$VER"
          OUT="AgentPad-$VER.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" "$OUT" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentPad $VER" \
            --notes "自动云端构建 · commit $GITHUB_SHA · R8 关闭" || \
          gh release upload "$TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$OUT" >> "$GITHUB_ENV"
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            src/app/build/reports/**
            src/build/reports/**
            /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7